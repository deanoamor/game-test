<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23ff8fb4%27/%3E%3C/svg%3E" />
<title>Hoshi no Kuni · Drone View</title>
<style>
  :root { --glass: rgba(14, 20, 34, 0.55); --line: rgba(255, 255, 255, 0.16); --ink: #f3f6fb; --dim: #aab6cc; --accent: #ff8fb4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; color: var(--ink); font: 13px/1.4 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app { transition: opacity .25s; }
  body.leaving #app, body.leaving #hud { opacity: 0; transition: opacity .25s; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .panel { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); padding: 10px 12px; }
  #hud.off .panel, #hud.off #title { display: none; }
  #title { position: fixed; left: 18px; top: 14px; text-shadow: 0 2px 12px rgba(0,0,0,.45); pointer-events: none; }
  #title .game { font-size: 11px; letter-spacing: .28em; color: var(--accent); text-transform: uppercase; }
  #title .place { font-size: 30px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
  #title .jp { font-size: 15px; color: var(--dim); letter-spacing: .3em; }
  #places { left: 14px; top: 116px; width: 226px; display: flex; flex-direction: column; gap: 3px; }
  #places h4, #time h4 { margin: 0 0 4px; font-size: 10px; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; font-weight: 600; }
  #places button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 8px; color: var(--ink); }
  #places button:hover, #places button.on { background: rgba(255,255,255,.14); }
  #places kbd { font: 600 10px ui-monospace, monospace; color: #0b1020; background: var(--accent); border-radius: 4px; padding: 0 5px; }
  #places small { color: var(--dim); margin-left: auto; font-size: 11px; }
  #time { right: 14px; top: 14px; width: 250px; }
  #time .clock { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 10px; }
  #time .clock span { font-size: 12px; font-weight: 500; color: var(--dim); }
  #time input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 2px; }
  #time .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  #time button, #time select { all: unset; cursor: pointer; background: rgba(255,255,255,.12); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: 12px; }
  #time select { padding-right: 6px; }
  .carTag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); background: #fff; color: #c42b1c; font-weight: 800; font-size: 15px; padding: 3px 10px; border-radius: 12px; border: 2px solid #c42b1c; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.3); animation: shake .18s infinite alternate; }
  .carTag.kind { color: #1f6b5a; border-color: #2f9a80; animation: none; max-width: 230px; white-space: normal; text-align: center; font-size: 14px; }
  .carTag.kind .en { color: #2c5a50; }
  .carTag .en { display: block; font-size: 11px; font-weight: 600; color: #444; text-align: center; margin-top: 1px; }
  @keyframes shake { from { margin-left: -2px; } to { margin-left: 2px; } }
  #time .row input[type=range] { width: 90px; margin: 0; }
  #time select option { color: #111; }
  #help { left: 14px; bottom: 14px; color: var(--dim); font-size: 12px; line-height: 1.7; }
  #help b { color: var(--ink); font-weight: 600; }
  #minimap { right: 14px; bottom: 14px; padding: 6px; }
  #minimap canvas { width: 210px; height: 210px; border-radius: 10px; cursor: pointer; }
  #exit { left: 50%; top: 18px; transform: translateX(-50%); text-align: center; min-width: 240px; display: none; }
  #exit.on { display: block; }
  #exit .lbl { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  #exit p { margin: 4px 0 8px; color: var(--dim); font-size: 12px; }
  #exit button { all: unset; cursor: pointer; border: 1px solid var(--line); background: #ffffff1f; border-radius: 8px; padding: 3px 12px; font-size: 12px; }
  #exit button:disabled { opacity: .4; cursor: default; }
  #talk { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(560px, 86vw); display: none; cursor: pointer; pointer-events: auto; }
  #talk.on { display: block; }
  #act { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; font-size: 13px; pointer-events: none; }
  #act.on { display: block; }
  #act b { background: rgba(255,255,255,.18); border-radius: 5px; padding: 1px 7px; margin-right: 4px; }
  #bag { z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, 92vw); max-height: 86vh; overflow: auto; display: none; pointer-events: auto; }
  #bag.on { display: block; }
  #bag .bh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #bag .bh b { font-size: 15px; } #bag .bh span { font-size: 12px; color: var(--dim); } #bag .bh .yen { margin-left: auto; color: var(--text, #fff); font-weight: 700; }
  #bag button { all: unset; cursor: pointer; }
  #bag .bh button { padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,.12); }
  #bag h5 { margin: 10px 0 4px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 600; } #bag h5 small { text-transform: none; letter-spacing: 0; }
  #bag .grid { display: grid; grid-template-columns: repeat(auto-fill, 52px); gap: 6px; }
  #bag .slot { position: relative; width: 52px; height: 52px; border-radius: 10px; background: rgba(255,255,255,.1); border: 1px solid var(--line); display: grid; place-items: center; font-size: 26px; }
  #bag .slot.empty { background: rgba(255,255,255,.04); }
  #bag .slot.sel { outline: 2px solid var(--accent); }
  #bag .slot i { position: absolute; right: 4px; bottom: 1px; font-size: 11px; font-style: normal; font-weight: 700; }
  #bag .slot:hover { background: rgba(255,255,255,.2); }
  #bag .bags { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #bag .bagcard { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 10px; background: rgba(255,255,255,.08); border: 1px solid var(--line); text-align: center; }
  #bag .bagcard span { font-size: 24px; } #bag .bagcard b { font-size: 11px; } #bag .bagcard small { font-size: 10px; color: var(--dim); }
  #bag .bagcard.on { outline: 2px solid var(--accent); background: rgba(255,255,255,.16); }
  #bag .info { margin-top: 10px; font-size: 13px; line-height: 1.5; min-height: 40px; } #bag .info button { margin-left: 6px; padding: 1px 10px; border-radius: 8px; background: var(--accent); color: #111; font-weight: 700; }
  #bag .msg { margin-top: 8px; font-size: 12px; color: var(--accent); min-height: 16px; }
  #bag .hint { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); text-align: right; margin-top: 4px; }
  #bag em { font-size: 12px; color: var(--dim); }
  #bag .rows .row { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  #bag .rows .row > span { font-size: 24px; } #bag .rows small { color: var(--dim); font-size: 11px; } #bag .rows i { font-style: normal; font-weight: 700; }
  #bag .chat { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 8px; background: rgba(255,255,255,.14); font-size: 12px; }
  #bag .basket { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.07); font-size: 13px; flex-wrap: wrap; }
  #bag .basket span { color: var(--dim); font-size: 12px; } #bag .basket .tot { margin-left: auto; color: #fff; font-weight: 700; font-size: 14px; }
  #bag .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  #bag .chip { padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,.12); font-size: 16px; } #bag .chip i { font-style: normal; font-size: 11px; margin-left: 2px; }
  #bag .pay { display: inline-block; margin-top: 8px; padding: 6px 18px; border-radius: 10px; background: var(--accent); color: #111; font-weight: 800; }
  #bag button[disabled] { opacity: .4; cursor: default; }
  #bag .rows button { padding: 2px 12px; border-radius: 8px; background: var(--accent); color: #111; font-weight: 700; }
  #talk .who { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
  #talk p { margin: 5px 0 6px; font-size: 14px; line-height: 1.5; }
  #talk .hint { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); text-align: right; }
  .npcTag { position: fixed; left: 0; top: 0; pointer-events: none; text-align: center; white-space: nowrap; text-shadow: 0 1px 4px #000c; z-index: 5; display: none; }
  .npcTag b { display: block; font-size: 12px; font-weight: 600; }
  .npcTag small { display: block; font-size: 10px; color: #ffd0e0; letter-spacing: .05em; }
  .npcTag .say { display: none; margin: 0 auto 4px; padding: 3px 9px; background: #fff; color: #223; border-radius: 10px; font-size: 12px; text-shadow: none; box-shadow: 0 2px 8px #0005; }
  #fps { position: fixed; right: 18px; bottom: 236px; font: 11px ui-monospace, monospace; color: #fff; opacity: .7; text-shadow: 0 1px 4px #000; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1c2a4a, #070b16); z-index: 20; transition: opacity .8s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .box { width: min(420px, 80vw); text-align: center; }
  #loading h1 { font-size: 13px; letter-spacing: .5em; font-weight: 600; color: var(--accent); margin: 0 0 6px; }
  #loading h2 { font-size: 34px; margin: 0 0 18px; font-weight: 700; }
  #loading .bar { height: 4px; background: rgba(255,255,255,.14); border-radius: 4px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff8fb4, #ffd27a); transition: width .25s; }
  #loading p { color: var(--dim); font-size: 12px; margin: 10px 0 0; min-height: 1.4em; }
  @media (max-width: 760px) { #places, #help { display: none; } #time { width: 200px; } #minimap canvas { width: 140px; height: 140px; } #fps { bottom: 168px; } #title .place { font-size: 22px; } }
  body.game .devonly { display: none !important; }
  #devBtn { position: fixed; right: 12px; bottom: 12px; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: rgba(10,14,30,.35); color: #fff; opacity: .35; cursor: pointer; font-size: 13px; pointer-events: auto; padding: 0; }
  #devBtn:hover { opacity: .9; }
  #devBox { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(300px, 90vw); display: none; pointer-events: auto; z-index: 60; }
  #devBox.on { display: block; }
  #devBox b { display: block; margin-bottom: 8px; font-size: 13px; }
  #devBox input { width: 100%; box-sizing: border-box; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.1); color: #fff; font-size: 14px; outline: none; }
  #devBox .msg { color: #ff9a9a; font-size: 12px; min-height: 16px; margin: 6px 0 2px; }
  #devBox .row { display: flex; gap: 8px; justify-content: flex-end; }
  #devBox button { all: unset; cursor: pointer; padding: 4px 14px; border-radius: 8px; background: rgba(255,255,255,.14); font-size: 12px; }
  #devBox button.go { background: var(--accent); color: #111; font-weight: 700; }
  #devBox.shake { animation: devshake .3s; }
  @keyframes devshake { 20% { transform: translate(calc(-50% - 8px), -50%); } 60% { transform: translate(calc(-50% + 8px), -50%); } }
  #devBadge { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 3px 6px 3px 12px; border-radius: 999px; background: rgba(255,90,90,.85); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .14em; pointer-events: auto; z-index: 50; }
  #devBadge button { all: unset; cursor: pointer; padding: 2px 10px; border-radius: 999px; background: rgba(0,0,0,.28); font-size: 10px; letter-spacing: .04em; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="title"><div class="game" id="worldName">Hoshi no Kuni · 星の国</div><div class="place" id="placeName">Sakura City</div><div class="jp" id="placeJp">桜シティ</div></div>
  <div id="places" class="panel devonly"><h4>Places</h4></div>
  <div id="time" class="panel">
    <h4>Time of day</h4>
    <div class="clock"><b id="clock">12:00</b><span id="phase">Midday</span></div>
    <input id="hour" class="devonly" type="range" min="0" max="24" step="0.05" value="12" />
    <div class="row"><button id="play" class="devonly">⏸ Pause</button><select id="quality"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
    <div class="row" style="margin-top:6px"><button id="bagBtn" title="B">🎒 Bag</button><button id="sound" title="M">🔊</button><input type="range" id="vol" min="0" max="1" step="0.05" value="0.7" title="Volume" /></div>
    <div class="row devonly" style="margin-top:6px"><span style="color:var(--dim);font-size:11px">World</span><select id="world" title="Go to another world (it loads afresh)"></select></div>
  </div>
  <div id="help" class="panel"><b>Drag</b> slide the map &nbsp; <b>Right-drag</b> turn &amp; tilt<br /><span id="helpZoom"><b>Wheel</b> zoom &nbsp; </span><b>W A S D</b> fly &nbsp; <b>Q E</b> turn &nbsp; <b>R F</b> tilt<br /><b>Shift</b> faster &nbsp; <b>1–9</b> places &nbsp; <b>T</b> time &nbsp; <b>B</b> bag &nbsp; <b>M</b> sound &nbsp; <b>H</b> hide HUD</div>
  <div id="minimap" class="panel"><canvas id="mini" width="420" height="420"></canvas></div>
  <div id="fps"></div>
  <div id="exit" class="panel"><div class="lbl" id="exitLabel">Exit</div><b id="exitName"></b><p id="exitNote"></p><button id="exitGo">Go on ▶</button></div>
</div>
<div id="loading"><div class="box"><h1>HOSHI NO KUNI</h1><h2>星の国</h2><div class="bar"><i id="bar"></i></div><p id="loadMsg">Shaping the land…</p></div></div>
<script>
  // any error while loading shows on the loading screen instead of leaving it frozen
  (function () {
    var show = function (m) { var el = document.getElementById('loadMsg'), ld = document.getElementById('loading'); if (el && ld && !ld.classList.contains('done')) el.textContent = 'Error: ' + m; };
    window.addEventListener('error', function (e) { show(e.message || 'script error'); });
    window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || String(e.reason)); });
  })();
</script>
<!-- on a static host (GitHub Pages) the TypeScript source cannot run: go to the built single-file game instead -->
<script type="module" src="./src/main.ts" onerror="location.replace('./play/')"></script>
</body>
</html>
