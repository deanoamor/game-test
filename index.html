<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23ff8fb4%27/%3E%3C/svg%3E" />
<title>Hoshi no Kuni · Drone View</title>
<style>
  :root { --glass: rgba(14, 20, 34, 0.55); --line: rgba(255, 255, 255, 0.16); --ink: #f3f6fb; --dim: #aab6cc; --accent: #ff8fb4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; color: var(--ink); font: 13px/1.4 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app { transition: opacity .25s; }
  body.leaving #app, body.leaving #hud { opacity: 0; transition: opacity .25s; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .panel { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); padding: 10px 12px; }
  #hud.off .panel, #hud.off #title { display: none; }
  #title { position: fixed; left: 18px; top: 14px; text-shadow: 0 2px 12px rgba(0,0,0,.45); pointer-events: none; }
  #title .game { font-size: 11px; letter-spacing: .28em; color: var(--accent); text-transform: uppercase; }
  #title .place { font-size: 30px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
  #title .jp { font-size: 15px; color: var(--dim); letter-spacing: .3em; }
  #places { left: 14px; top: 116px; width: 226px; display: flex; flex-direction: column; gap: 3px; }
  #places h4, #time h4 { margin: 0 0 4px; font-size: 10px; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; font-weight: 600; }
  #places button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 8px; color: var(--ink); }
  #places button:hover, #places button.on { background: rgba(255,255,255,.14); }
  #places kbd { font: 600 10px ui-monospace, monospace; color: #0b1020; background: var(--accent); border-radius: 4px; padding: 0 5px; }
  #places small { color: var(--dim); margin-left: auto; font-size: 11px; }
  #time { right: 14px; top: 14px; width: 250px; }
  #time .clock { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 10px; }
  #time .clock span { font-size: 12px; font-weight: 500; color: var(--dim); }
  #time input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 2px; }
  #time .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  #time button, #time select { all: unset; cursor: pointer; background: rgba(255,255,255,.12); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: 12px; }
  #time select { padding-right: 6px; }
  .carTag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); background: #fff; color: #c42b1c; font-weight: 800; font-size: 15px; padding: 3px 10px; border-radius: 12px; border: 2px solid #c42b1c; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.3); animation: shake .18s infinite alternate; }
  @keyframes shake { from { margin-left: -2px; } to { margin-left: 2px; } }
  #time .row input[type=range] { width: 110px; margin: 0; }
  #time select option { color: #111; }
  #help { left: 14px; bottom: 14px; color: var(--dim); font-size: 12px; line-height: 1.7; }
  #help b { color: var(--ink); font-weight: 600; }
  #minimap { right: 14px; bottom: 14px; padding: 6px; }
  #minimap canvas { width: 210px; height: 210px; border-radius: 10px; cursor: pointer; }
  #exit { left: 50%; top: 18px; transform: translateX(-50%); text-align: center; min-width: 240px; display: none; }
  #exit.on { display: block; }
  #exit .lbl { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  #exit p { margin: 4px 0 8px; color: var(--dim); font-size: 12px; }
  #exit button { all: unset; cursor: pointer; border: 1px solid var(--line); background: #ffffff1f; border-radius: 8px; padding: 3px 12px; font-size: 12px; }
  #exit button:disabled { opacity: .4; cursor: default; }
  #talk { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(560px, 86vw); display: none; cursor: pointer; pointer-events: auto; }
  #talk.on { display: block; }
  #talk .who { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
  #talk p { margin: 5px 0 6px; font-size: 14px; line-height: 1.5; }
  #talk .hint { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); text-align: right; }
  .npcTag { position: fixed; left: 0; top: 0; pointer-events: none; text-align: center; white-space: nowrap; text-shadow: 0 1px 4px #000c; z-index: 5; display: none; }
  .npcTag b { display: block; font-size: 12px; font-weight: 600; }
  .npcTag small { display: block; font-size: 10px; color: #ffd0e0; letter-spacing: .05em; }
  .npcTag .say { display: none; margin: 0 auto 4px; padding: 3px 9px; background: #fff; color: #223; border-radius: 10px; font-size: 12px; text-shadow: none; box-shadow: 0 2px 8px #0005; }
  #fps { position: fixed; right: 18px; bottom: 236px; font: 11px ui-monospace, monospace; color: #fff; opacity: .7; text-shadow: 0 1px 4px #000; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1c2a4a, #070b16); z-index: 20; transition: opacity .8s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .box { width: min(420px, 80vw); text-align: center; }
  #loading h1 { font-size: 13px; letter-spacing: .5em; font-weight: 600; color: var(--accent); margin: 0 0 6px; }
  #loading h2 { font-size: 34px; margin: 0 0 18px; font-weight: 700; }
  #loading .bar { height: 4px; background: rgba(255,255,255,.14); border-radius: 4px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff8fb4, #ffd27a); transition: width .25s; }
  #loading p { color: var(--dim); font-size: 12px; margin: 10px 0 0; min-height: 1.4em; }
  @media (max-width: 760px) { #places, #help { display: none; } #time { width: 200px; } #minimap canvas { width: 140px; height: 140px; } #fps { bottom: 168px; } #title .place { font-size: 22px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="title"><div class="game" id="worldName">Hoshi no Kuni · 星の国</div><div class="place" id="placeName">Sakura City</div><div class="jp" id="placeJp">桜シティ</div></div>
  <div id="places" class="panel"><h4>Places</h4></div>
  <div id="time" class="panel">
    <h4>Time of day</h4>
    <div class="clock"><b id="clock">12:00</b><span id="phase">Midday</span></div>
    <input id="hour" type="range" min="0" max="24" step="0.05" value="12" />
    <div class="row"><button id="play">⏸ Pause</button><select id="quality"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
    <div class="row" style="margin-top:6px"><button id="sound" title="M">🔊 Sound</button><input type="range" id="vol" min="0" max="1" step="0.05" value="0.7" title="Volume" /></div>
    <div class="row" style="margin-top:6px"><span style="color:var(--dim);font-size:11px">World</span><select id="world" title="Go to another world (it loads afresh)"></select></div>
  </div>
  <div id="help" class="panel"><b>Drag</b> slide the map &nbsp; <b>Right-drag</b> turn &amp; tilt<br /><span id="helpZoom"><b>Wheel</b> zoom &nbsp; </span><b>W A S D</b> fly &nbsp; <b>Q E</b> turn &nbsp; <b>R F</b> tilt<br /><b>Shift</b> faster &nbsp; <b>1–9</b> places &nbsp; <b>T</b> time &nbsp; <b>H</b> hide HUD</div>
  <div id="minimap" class="panel"><canvas id="mini" width="420" height="420"></canvas></div>
  <div id="fps"></div>
  <div id="exit" class="panel"><div class="lbl" id="exitLabel">Exit</div><b id="exitName"></b><p id="exitNote"></p><button id="exitGo">Go on ▶</button></div>
</div>
<div id="loading"><div class="box"><h1>HOSHI NO KUNI</h1><h2>星の国</h2><div class="bar"><i id="bar"></i></div><p id="loadMsg">Shaping the land…</p></div></div>
<script>
  // any error while loading shows on the loading screen instead of leaving it frozen
  (function () {
    var show = function (m) { var el = document.getElementById('loadMsg'), ld = document.getElementById('loading'); if (el && ld && !ld.classList.contains('done')) el.textContent = 'Error: ' + m; };
    window.addEventListener('error', function (e) { show(e.message || 'script error'); });
    window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || String(e.reason)); });
  })();
</script>
<!-- on a static host (GitHub Pages) the TypeScript source cannot run: go to the built single-file game instead -->
<script type="module" src="./src/main.ts" onerror="location.replace('./play/')"></script>
</body>
</html>
